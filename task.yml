
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean up the workspace before building the application.
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        find "$(workspaces.source.path)" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flake8
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install flake8
        flake8 . --count --show-source --statistics
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: unit-tests
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install nose
        nosetests
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah
spec:
  params:
    - name: IMAGE
      type: string
  workspaces:
    - name: source
  steps:
    - name: build
      image: quay.io/buildah/stable:latest
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      script: |
        #!/bin/sh
        set -eu
        buildah bud --storage-driver=vfs -t "$(params.IMAGE)" .
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy
spec:
  params:
    - name: APP_NAME
      type: string
    - name: IMAGE
      type: string
  steps:
    - name: deploy-to-openshift
      image: quay.io/openshift/origin-cli:latest
      script: |
        #!/bin/sh
        set -eu
        oc new-app --name="$(params.APP_NAME)" "$(params.IMAGE)" || \
          oc set image "deployment/$(params.APP_NAME)" \
          "$(params.APP_NAME)=$(params.IMAGE)"
        oc rollout status "deployment/$(params.APP_NAME)"
